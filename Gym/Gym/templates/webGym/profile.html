{% extends "webGym/main.html" %}
{% load static %}

{% block title %}Профиль{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card reveal" style="padding-top:110px">
        <h1 class="title">Профиль <span class="neon">пользователя</span></h1>
        <p class="text-muted" style="margin:6px 0 24px">
            Здесь будут настройки аккаунта: персональные данные, аватар и предпочтения.
        </p>

        <div class="field"><label>Логин</label><div class="control"><input type="text" value="{{ user.username|default:'' }}" disabled></div></div>
        <div class="field"><label>E-mail</label><div class="control"><input type="email" value="{{ user.email|default:'' }}" disabled></div></div>
        <div class="field"><label>Дата регистрации</label><div class="control"><input type="text" value="{{ user.date_joined|date:'d.m.Y'|default:'—' }}" disabled></div></div>

        <p class="auth-alt text-muted" style="text-align:center">
            Редактирование профиля станет доступно в ближайшем обновлении.
        </p>
    </div>
</div>
{% endblock %}
